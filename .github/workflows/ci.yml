name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    name: templates.json
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun scripts/check-manifest.ts
      - id: m
        run: echo "matrix=$(bun scripts/check-manifest.ts --matrix)" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.template }})
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      # Users install with their own Bun: bun.lock must stay text format v1 and install with the oldest supported Bun
      # (engines.bun, 1.3.3); a v2 lockfile made an old Bun ignore it and re-resolve (vibechat-desktop t159u).
      - name: bun.lock is format v1
        run: |
          grep -q '"lockfileVersion": 1,' bun.lock
      - name: Install with the oldest supported Bun (engines.bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile && rm -rf node_modules
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ matrix.template }}/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Working tree stays clean (no generated drift)
        run: git diff --exit-code -- .
